<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VisualMath.Lim — Bilangan Real TKA Matematika Wajib SMA</title>
<meta name="description" content="Materi Bilangan Real TKA Matematika Wajib SMA dengan latihan pemahaman dan pembahasan jawaban.">
<style>
:root{--navy:#071b3b;--navy2:#0d2b5b;--cyan:#06d9d2;--cyan2:#1fe7ff;--yellow:#ffc928;--yellow2:#ffdf55;--ink:#132238;--muted:#5e6d82;--paper:#f7fbff;--white:#ffffff;--line:#dbe7f2;--shadow:0 16px 44px rgba(9,36,77,.12);--radius:22px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#edf8ff 0%,#f7fbff 35%,#fff 100%);color:var(--ink);line-height:1.68}a{color:inherit}
.topbar{position:sticky;top:0;z-index:30;background:rgba(7,27,59,.94);backdrop-filter:blur(16px);color:#fff;border-bottom:1px solid rgba(255,255,255,.1)}.topbar-inner{max-width:1200px;margin:auto;display:flex;align-items:center;gap:18px;padding:10px 22px}.brand-mini{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:900;letter-spacing:.4px}.brand-mini img{height:52px;width:auto;display:block}.progress-wrap{flex:1;height:8px;background:rgba(255,255,255,.15);border-radius:999px;overflow:hidden}.progress{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--yellow));transition:width .2s}
.layout{max-width:1200px;margin:auto;display:grid;grid-template-columns:270px 1fr;gap:24px;padding:26px 20px 70px}.sidebar{position:sticky;top:82px;align-self:start;background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}.sidebar h3{margin:0 0 12px;font-size:14px;text-transform:uppercase;letter-spacing:1.2px;color:var(--navy)}.sidebar a{display:block;padding:8px 10px;border-radius:12px;text-decoration:none;color:var(--muted);font-size:13px}.sidebar a:hover{background:#eafcff;color:var(--navy)}
.main{min-width:0}.hero{background:radial-gradient(circle at 80% 15%,rgba(31,231,255,.2),transparent 35%),linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;border-radius:30px;padding:34px 34px 32px;box-shadow:var(--shadow);overflow:hidden;position:relative}.hero::after{content:"";position:absolute;width:230px;height:230px;border-radius:50%;right:-70px;bottom:-120px;background:rgba(255,201,40,.14)}.hero-logo{height:180px;max-width:100%;object-fit:contain;display:block;margin:0 auto 8px}.eyebrow{display:inline-flex;gap:9px;align-items:center;font-size:12px;font-weight:900;letter-spacing:1.5px;text-transform:uppercase;color:#dffcff;margin-top:5px}.dot{width:8px;height:8px;border-radius:50%;background:var(--yellow);box-shadow:0 0 0 6px rgba(255,201,40,.1)}.hero h1{font-size:clamp(32px,4.5vw,58px);line-height:1.03;margin:12px 0 10px;letter-spacing:-1.8px}.hero p{max-width:820px;margin:0;color:#d6e8fb;font-size:17px}.hero-strip{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);padding:8px 12px;border-radius:999px;font-size:12px;font-weight:800}
.section{margin-top:22px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:28px;padding:30px;box-shadow:var(--shadow);scroll-margin-top:84px}.section h2{margin:4px 0 18px;color:var(--navy);font-size:clamp(26px,3vw,38px);line-height:1.15;letter-spacing:-.7px}.section h3{color:var(--navy);margin:0 0 9px;font-size:18px}.section p{margin:8px 0}.section ul,.section ol{padding-left:22px}.section-kicker,.mission-badge,.quiz-label{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:900;letter-spacing:1.3px;text-transform:uppercase}.section-kicker{color:#0f7480;margin-bottom:4px}.mission-badge{color:var(--navy);background:linear-gradient(90deg,var(--yellow2),#fff1a8);padding:8px 12px;border-radius:999px;box-shadow:0 5px 14px rgba(255,201,40,.25)}.big-idea{margin:14px 0 20px;border-left:5px solid var(--cyan);background:linear-gradient(90deg,#e9feff,#f7ffff);padding:14px 16px;border-radius:0 16px 16px 0}.big-idea span{display:block;font-size:10px;letter-spacing:1.3px;color:#0f7f8a;font-weight:900;margin-bottom:3px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card,.challenge,.error-card,.tip,.note-block{border:1px solid var(--line);border-radius:18px;padding:18px;background:#fff}.card{box-shadow:0 8px 20px rgba(9,36,77,.05)}.card.accent{background:linear-gradient(180deg,#fbffff,#effcff)}.formula{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:17px;background:#f2f7fb;border:1px dashed #cbdbea;border-radius:14px;padding:12px 14px;margin:12px 0;color:#0b2c55;overflow:auto}.formula-list>div{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#f7fafc;border:1px solid #e6eef5;padding:10px 12px;border-radius:12px;margin:7px 0}.worked{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;background:var(--navy);color:#fff;border-radius:16px;padding:14px 16px;font-weight:800}.tip{background:linear-gradient(135deg,#f0fffc,#fffbe4);border-color:#d7ecd9}.note,.note-block{color:var(--muted);font-size:13px}.note-block{margin-top:14px;background:#f7fbff}.challenge{background:linear-gradient(180deg,#fbfdff,#f8fbff);margin:12px 0}
.error-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.error-card{background:#fff7f2;border-color:#f2dfd3}.error-card b{display:inline-flex;align-items:center;justify-content:center;height:30px;padding:0 9px;border-radius:999px;background:#fff0e6;color:#9a4e22;font-size:11px;letter-spacing:1px}.error-card h3{font-size:15px;margin-top:10px}.correct{font-weight:800;color:#16705d}
.practice{margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}.practice>h3{font-size:20px}.quiz-card{background:linear-gradient(180deg,#fff,#f8fbff);border:1px solid #d7e5f0;border-radius:18px;padding:17px;margin:13px 0}.quiz-head{display:flex;justify-content:flex-end}.quiz-label{color:#0a6a74;background:#e7ffff;padding:6px 9px;border-radius:999px}.question{font-weight:800;font-size:16px;margin:8px 0 12px}.options{display:grid;gap:8px}.option{display:flex;gap:10px;align-items:flex-start;border:1px solid #e0e9f0;border-radius:12px;padding:10px 12px;cursor:pointer;background:#fff}.option:hover{border-color:#a9dce3;background:#fbffff}.option input{margin-top:4px;accent-color:#0baeb1}.quiz-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.btn{appearance:none;border:0;border-radius:12px;padding:10px 13px;font-weight:900;cursor:pointer}.btn-primary{background:linear-gradient(90deg,var(--cyan),#2be5ef);color:#04273e}.btn-check{background:var(--navy);color:#fff}.btn-ghost{background:#edf5fa;color:var(--navy)}.result{min-height:28px;margin-top:10px;font-weight:800}.result.ok{color:#137b5e}.result.bad{color:#a94a31}.explain{display:none;margin-top:9px;padding:12px 13px;background:#fffce8;border:1px solid #f2e4a4;border-radius:12px;color:#564d15}.explain.show{display:block}
.master{background:linear-gradient(145deg,#fdfefe,#f4fbff)}.master-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.score-panel{margin-top:18px;border-radius:20px;background:var(--navy);color:#fff;padding:20px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.score-panel p{color:#cfe2f4;margin:0;max-width:500px}.score-num{font-size:46px;line-height:1;font-weight:950;color:var(--yellow)}.score-denom{font-size:20px;color:#bfe3ee}
.footer{margin-top:24px;background:var(--navy);color:#d9ebf4;border-radius:24px;padding:26px;text-align:center}.footer img{height:92px;display:block;margin:0 auto 8px}.footer strong{color:#fff}.source-note{font-size:12px;color:#b9cedf;max-width:820px;margin:10px auto 0}
@media (max-width:1000px){.layout{grid-template-columns:1fr}.sidebar{position:static}.error-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.topbar-inner{padding:8px 12px}.brand-mini span{display:none}.layout{padding:16px 12px 50px}.hero{padding:25px 20px;border-radius:24px}.hero-logo{height:130px}.section{padding:21px;border-radius:22px}.grid-2,.grid-3,.master-grid{grid-template-columns:1fr}.error-grid{grid-template-columns:1fr}}
@media print{.topbar,.sidebar,.quiz-actions{display:none!important}body{background:#fff}.layout{display:block;padding:0}.hero,.section,.footer{box-shadow:none;border:1px solid #cfd9e3;break-inside:avoid}}
</style>
</head>
